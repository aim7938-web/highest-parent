<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이스트 학부모</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하이스트">
<meta name="theme-color" content="#1E5450">
<style>
  html,body{margin:0;height:100%;background:#F5F9F9;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #msg{font-family:'Malgun Gothic',sans-serif;color:#68736F;text-align:center;padding:40vh 24px 0;font-size:17px;line-height:1.6}
  #bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9;
       display:none;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-radius:14px;
       background:#1E5450;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.25);
       font:14px/1.5 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  #bar .tx{flex:1}
  #bar button{border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
  #bar .go{background:#fff;color:#1E5450;padding:8px 12px;white-space:nowrap}
  #bar .x{background:transparent;color:#fff;font-size:20px;line-height:1;padding:2px 4px;opacity:.7}
</style>
</head>
<body>
<div id="msg">불러오는 중…</div>
<div id="bar"><div class="tx"></div><button class="go" hidden></button><button class="x" aria-label="닫기">×</button></div>
<script>
  // 학부모 앱(Apps Script) 정식 배포 주소 — parent/올리기.bat의 배포 ID와 같아야 함
  var APP = 'https://script.google.com/macros/s/AKfycbymt5e8PiwZKELE6vOuAD6CiQi0Bs2iRqTM2X4B85SgJhj0hGZOYXd1T7zQ1RasHBhi/exec';
  // 이 페이지 주소 — 카카오 개발자 사이트의 Redirect URI, parent/Code.js의 CFG.OUTER와 글자 하나까지 같아야 함
  var HOME = 'https://aim7938-web.github.io/highest-parent/';
  // 카카오 REST API 키 (카카오 개발자 사이트 > 앱 > 앱 키). 비어 있으면 카카오 로그인 단추가 아무 일도 안 함.
  // 같은 키를 학부모 앱 스크립트 속성 KAKAO_REST에도 넣는다. 공개돼도 되는 값(로그인 주소에 그대로 보임).
  var KAKAO_KEY = '506a10ba6e978551fd7bbb5e2358c8a9';   // 카카오 앱 '하이스트' > 플랫폼 키 > REST API 키 '하이스트 학부모 앱'

  // 알림(FCM) — 선생님 앱과 같은 파이어베이스 프로젝트(highest-push). 공개돼도 되는 값.
  var PUSH = {
    apiKey: 'AIzaSyBIBrB2RN_5OVesH2T3qXW5Zt_Bz9Z1CJw', authDomain: 'highest-push.firebaseapp.com',
    projectId: 'highest-push', messagingSenderId: '623997019111',
    appId: '1:623997019111:web:1de56f27ceec004a951342',
    vapidKey: 'BKpZ1qvO03ysuRmf3cptGOB0-4e3zT8O0VAwzIM-pfpo1Sq8_LtQsuvEtqxaDjn76fO4ClE9GCeKkWHS8cvSY6U'
  };
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/';

  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(k) || '';
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { return ''; }
  }

  // ─── 들어갈 열쇠 모으기 ────────────────────────────────
  // t: 학원이 보낸 링크의 열쇠. 한 번 열면 기억해 두어 홈 화면 아이콘으로 열어도 그대로 들어간다.
  // s: 카카오로 한 번 들어온 뒤 받은 세션.  kc: 카카오 로그인에서 막 돌아왔을 때의 인가 코드(한 번만 씀).
  var q = new URLSearchParams(location.search);
  var t = q.get('t') || '', kc = '';
  if (t) store('hpLink', t); else t = store('hpLink');
  if (q.get('code') && q.get('state') && q.get('state') === store('hpKakaoState')) kc = q.get('code');
  store('hpKakaoState', null);
  // 주소창에서 카카오 코드를 지운다 (새로고침해도 같은 코드를 다시 보내지 않게).
  // 링크 열쇠(t)는 주소에 남긴다 — 아이폰은 홈 화면 아이콘이 따로 저장 공간을 써서 기억해 둔 열쇠를 못 읽으므로,
  // 홈 화면에 추가할 때의 주소(?t=…)로 열려야 들어온다 (manifest에 start_url을 두지 않는 까닭)
  var here = HOME + (t ? '?t=' + encodeURIComponent(t) : '');
  if (location.href !== here) { try { history.replaceState(null, '', here); } catch (e) {} }

  var f = document.createElement('iframe');
  // w=1: 겉 페이지 안에서 열렸다는 표시
  f.src = APP + '?w=1&t=' + encodeURIComponent(t) + '&s=' + encodeURIComponent(store('hpSess')) + '&kc=' + encodeURIComponent(kc);
  f.title = '하이스트 학부모';
  f.onload = function () { var m = document.getElementById('msg'); if (m) m.remove(); };
  document.body.appendChild(f);

  // ─── 학부모 앱 화면과 연결 ──────────────────────────────
  // {highest:'sess', s}   카카오 세션 기억
  // {highest:'kakao'}     카카오 로그인 화면으로 이동
  // {highest:'need-fcm'}  이 기기의 알림 주소를 달라 → {highest:'fcm', fcm}
  var FCM = '', peer = null, peerOrigin = '';
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[\w.-]+\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data || {};
    if (d.highest === 'sess' && /^[\w.|=-]{10,600}$/.test(d.s || '')) store('hpSess', d.s);
    else if (d.highest === 'kakao') kakaoLogin();
    // need-fcm은 학부모가 들어온 뒤에 온다 → 그때 설치·알림 안내를 띄운다
    else if (d.highest === 'need-fcm') { peer = e.source; peerOrigin = e.origin; give(); entered = true; nextBar(); }
  });
  function give() {
    if (!FCM || !peer) return;
    try { peer.postMessage({ highest: 'fcm', fcm: FCM, ua: navigator.userAgent.slice(0, 150) }, peerOrigin); } catch (e) {}
  }

  function kakaoLogin() {
    if (!KAKAO_KEY) { bar('카카오 로그인은 아직 준비 중입니다. 학원에서 받은 링크로 들어와 주세요.'); return; }
    var state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    store('hpKakaoState', state);
    location.href = 'https://kauth.kakao.com/oauth/authorize?response_type=code'
      + '&client_id=' + encodeURIComponent(KAKAO_KEY)
      + '&redirect_uri=' + encodeURIComponent(HOME)
      + '&state=' + encodeURIComponent(state);
  }

  // ─── 아래 안내 띠: ① 바탕화면 설치 → ② 알림 받기 ─────────────
  // 학부모가 들어온 뒤(need-fcm을 받은 뒤)에만 띄운다. 입장 화면에서는 띄우지 않는다.
  // 웹페이지는 허락 없이 아이콘을 깔 수 없어서, 안드로이드는 [설치] 단추로 설치 창을 띄우고
  // 아이폰은 설치 기능이 없어 공유 → '홈 화면에 추가'를 안내한다.
  var entered = false, installEvt = null, REG = null;
  var UA = navigator.userAgent;
  var IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  var KAKAOTALK = /KAKAOTALK/i.test(UA);
  function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone; }

  // 안드로이드 크롬·삼성 인터넷: 설치할 수 있으면 이 신호가 온다 (이미 설치했으면 안 온다)
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvt = e;
    if (entered) nextBar();
  });
  window.addEventListener('appinstalled', function () {
    installEvt = null;
    bar('바탕화면에 하이스트 아이콘을 만들었어요. 다음부터 아이콘을 눌러 열어 주세요.');
    setTimeout(nextBar, 4000);
  });

  setupPush();

  function bar(text, btn, onBtn, dismissKey, onClose) {
    var b = document.getElementById('bar'), go = b.querySelector('.go');
    b.querySelector('.tx').textContent = text;
    go.hidden = !btn; go.textContent = btn || ''; go.onclick = onBtn || null;
    b.querySelector('.x').onclick = function () {
      b.style.display = 'none';
      if (dismissKey) store(dismissKey, String(Date.now()));
      if (onClose) onClose();
    };
    b.style.display = 'flex';
  }
  function hideBar() { document.getElementById('bar').style.display = 'none'; }
  function dismissed(k, days) { return Date.now() - Number(store(k) || 0) < days * 864e5; }

  // 지금 띄울 안내 하나를 고른다
  function nextBar() {
    if (!entered) return;
    if (KAKAOTALK) {
      if (!dismissed('hpBarKakao', 7))
        bar('카카오톡 안에서는 바탕화면 설치와 알림이 안 돼요. 오른쪽 아래 ⋮(또는 공유) → "다른 브라우저로 열기"를 눌러 주세요.', '', null, 'hpBarKakao');
      return;
    }
    if (!standalone()) {
      if (installEvt && !dismissed('hpBarInstall', 3)) {
        bar('하이스트 학부모 앱을 바탕화면에 설치할까요? 다음부터 아이콘으로 바로 열려요.', '설치', function () {
          var ev = installEvt;
          installEvt = null;
          hideBar();
          ev.prompt();
          ev.userChoice.then(function (c) {
            if (c.outcome !== 'accepted') { store('hpBarInstall', String(Date.now())); nextBar(); }
          });
        }, 'hpBarInstall', nextBar);
        return;
      }
      if (IOS) {
        if (!dismissed('hpBarIos', 3))
          bar('바탕화면에 설치하려면 아래 공유 버튼(□↑) → "홈 화면에 추가"를 눌러 주세요. 아이콘으로 열어야 알림도 받을 수 있어요.', '', null, 'hpBarIos');
        return;   // 아이폰은 홈 화면 아이콘으로 열어야만 알림이 된다
      }
    }
    askPush();
  }

  function askPush() {
    if (!REG || !PUSH.appId || !('Notification' in window) || !('PushManager' in window)) return;
    if (Notification.permission !== 'default' || dismissed('hpBarAsk', 3)) return;
    bar('담임 코멘트·학원 공지·테스트 점수가 올라오면 알림으로 알려 드릴까요?', '알림 받기', function () {
      Notification.requestPermission().then(function (p) {
        if (p === 'granted') {
          getFcm(REG);
          bar('알림이 켜졌어요. 새 소식이 올라오면 알려 드릴게요.');
          setTimeout(hideBar, 3000);
        } else {
          bar('알림이 꺼져 있어요. 휴대폰 설정에서 이 앱(또는 브라우저)의 알림을 허용하면 받을 수 있어요.', '', null, 'hpBarAsk');
        }
      });
    }, 'hpBarAsk');
  }

  function setupPush() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      REG = reg;
      clearBadge(reg);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') clearBadge(reg);
      });
      // 이미 알림을 허용한 기기면 알림 주소만 조용히 받아 둔다
      if (PUSH.appId && 'Notification' in window && Notification.permission === 'granted') getFcm(reg);
      if (entered) nextBar();
    }).catch(function () {});
  }

  function clearBadge(reg) {
    try { if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (e) {}
    try { reg.getNotifications().then(function (ns) { ns.forEach(function (n) { n.close(); }); }); } catch (e) {}
  }

  // 이 기기의 알림 주소(FCM 토큰) 받기 → 학부모 앱 화면에 넘겨 줌 (화면이 자기 표로 등록한다)
  function getFcm(reg) {
    Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-messaging.js')])
      .then(function (m) {
        var app = m[0].initializeApp(PUSH);
        return m[1].getToken(m[1].getMessaging(app), { vapidKey: PUSH.vapidKey, serviceWorkerRegistration: reg });
      })
      .then(function (fcm) { if (fcm) { FCM = fcm; give(); } })
      .catch(function () {});
  }
</script>
</body>
</html>
